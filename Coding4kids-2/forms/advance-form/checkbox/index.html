<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input | CheckBox</title>
</head>
<body>
    <h1>Input | CheckBox</h1>
    <p>Check allows users to select one or more options from a list.</p>

    <h3>Example</h3>

    <p>In this example, the user can select one or more options:</p>
    <form action="">
        <p>Select your favorite vehicles:</p>
        <input type="checkbox" name="vehicle1" value="Bike"> I have a bike<br>
        <input type="checkbox" name="vehicle2" value="Car"> I have a car<br>
        <input type="checkbox" name="vehicle3" value="Boat"> I have a boat<br>
        <input type="checkbox" name="vehicle4" value="Plane"> I have a plane<br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
