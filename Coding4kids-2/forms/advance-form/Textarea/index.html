<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input | Textarea</title>
</head>
<body>
    <h1>Textarea</h1>
    <p>Textareas allow users to enter multiple lines of text.</p>

    <h3>Example</h3>

    <p>In this example, the user can enter multiple lines of text:</p>
    <form action="">
        <label for="message">Your message:</label><br>
        <textarea name="message" id="message" rows="5" cols="50" placeholder="Type your life story here"></textarea><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
